schema: spec-driven

context: |
  Project: skillkit
  Description: Agent-agnostic AI skill collection. Canonical skill format compiled to per-agent outputs (Claude Code SKILL.md, Cursor .mdc, Copilot copilot-instructions.md, etc.)
  Tech stack: TypeScript / Node.js — build scripts and adapters in TS; JSON Schema for canonical skill metadata validation
  Architecture: canonical source + adapters + build pipeline (NOT flat manual folders)
  Testing: none configured (greenfield) — strict_tdd: false
  Artifact store: hybrid (openspec files + engram)

testing:
  strict_tdd: false
  test_runner: none
  framework: none
  layers:
    unit: false
    integration: false
    e2e: false
  coverage: false
  quality:
    linter: false
    type_checker: false
    formatter: false

rules:
  proposal:
    - Include rollback plan for risky changes
    - Scope to canonical format design, adapter interface, or build pipeline
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
    - Address adapter extension points explicitly
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    - Follow existing code patterns
    tdd: false
    test_command: ""
  verify:
    test_command: ""
    build_command: ""
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas
